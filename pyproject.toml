[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "badminton-ranking"
version = "1.1.0"
description = "An ELO-like engine tasked with ranking, analysing and generating for my badminton group."
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18,<1", "matplotlib>=3.8,<4"]

[project.scripts]
badminton = "badminton.cli:main"

[tool.setuptools.packages.find]
include = ["badminton*"]